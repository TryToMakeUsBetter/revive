[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revive"
version = "0.1.0"
description = "一个轻量级对话助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
revive-server = "revive.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revive = ["py.typed"]
