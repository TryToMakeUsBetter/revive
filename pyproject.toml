[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revive"
version = "0.1.0"
description = "根据对话内容模拟对方语气和内容的微信 agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "itchat-uos==1.5.0.dev0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
revive = "revive.cli:main"
revive-server = "revive.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revive = ["py.typed"]
